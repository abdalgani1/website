<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilingual Text Splitter</title>
  <script src="https://unpkg.com/react@17.0.2/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 10px;
      background-color: #f4f4f4;
    }

    .app-container {
      display: flex;
      width: 100%;
      gap: 10px;
      overflow-x: auto;
    }

    .language-part {
      flex: 1;
      min-width: 300px;
      background-color: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px;
    }

    .button-container {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .main-input {
      width: 100%;
      height: 150px;
      margin-bottom: 10px;
      resize: vertical;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
    }

    .button {
      flex-grow: 1;
      padding: 10px;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
    }

    .split-button {
      background-color: #007bff;
    }

    .count-button {
      background-color: #17a2b8;
    }

    .small-input-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .small-input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .small-input-number {
      width: 50px;
      text-align: right;
      color: #666;
      font-size: 14px;
      flex-shrink: 0;
    }

    .small-input {
      flex-grow: 1;
      height: 60px;
      resize: vertical;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
    }

    .unite-button {
      width: 45%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      margin-top: 10px;
      margin-bottom: 10px;
      margin-left: 10px;
    }

    .output-area {
      width: 100%;
      height: 150px;
      resize: vertical;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
    }

    .language-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .kakko-number {
      position: absolute;
      right: -50px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 14px;
    }

    .play-button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      width: 30px;
      height: 30px;
      margin-left: 5px;
    }

    /* Add this for RTL support */
    .language-part[lang="ar"] {
      direction: rtl;
      text-align: right;
    }

    .language-part[lang="ar"] .main-input,
    .language-part[lang="ar"] .small-input,
    .language-part[lang="ar"] .output-area {
      direction: rtl;
      text-align: right;
    }

    .language-part[lang="ar"] .small-input-number {
      text-align: left; /* Since numbers in Arabic are still left-aligned */
    }

    /* Adjust button alignment for RTL languages */
    .language-part[lang="ar"] .button-container,
    .language-part[lang="ar"] .unite-button {
      justify-content: flex-end;
    }
  </style>
</head>

<body>
  <div style="display: flex; justify-content: center;">
    <input class="folder-name" type="text" style="width: 100px;">
  </div>
  <div id="root"></div>
  <audio id="audioPlayer" style="display:none;"></audio>

  <script type="text/babel">
    function TextSplitterPart({ language, lang, initialDelimiter, isJapanese, scrollTop, setScrollTop, setOutput, outputText }) {
        const [mainText, setMainText] = React.useState('');
        const [smallTexts, setSmallTexts] = React.useState(new Array(1500).fill(''));
        const [delimiter, setDelimiter] = React.useState(initialDelimiter);
        const scrollRef = React.useRef(null);

        React.useEffect(() => {
            if (scrollRef.current) {
            scrollRef.current.scrollTop = scrollTop;
            }
        }, [scrollTop, scrollRef]);

        React.useEffect(() => {
            setOutput(outputText); // When loading, update the output box
        }, [outputText]);

        const handleSplit = () => {
            const splitTexts = mainText.split(delimiter).map(text => text.trim());
            setSmallTexts(splitTexts.concat(new Array(1500 - splitTexts.length).fill('')));
            };

        const handleUnite = () => {
            const unitedText = smallTexts.filter(text => text.trim()).join(delimiter);
            setOutput(unitedText);
        };

        const handleScroll = (e) => {
            setScrollTop(e.target.scrollTop);
        };

        return (
            <div className="language-part" lang={lang}>
                <div className="language-title">{language} Part</div>
                <input
                    type="text"
                    value={delimiter}
                    onChange={(e) => setDelimiter(e.target.value)}
                    placeholder="Delimiter"
                    style={{ width: '100%', marginBottom: '10px' }}
                />
                <textarea
                    className="main-input"
                    value={mainText}
                    onChange={(e) => setMainText(e.target.value)}
                    placeholder={`Enter ${language} text to split`}
                    rows="5"
                />
                <div className="button-container">
                    <button className="button split-button" onClick={handleSplit}>
                        Split
                    </button>
                </div>
                <div className="small-input-container" ref={scrollRef} onScroll={handleScroll}>
                    {smallTexts.map((text, index) => (
                        <div key={index} className="small-input-wrapper">
                            <div className="small-input-number">{index + 1}.</div>
                            <textarea
                                className="small-input"
                                value={text}
                                onChange={(e) => {
                                const newTexts = [...smallTexts];
                                newTexts[index] = e.target.value;
                                setSmallTexts(newTexts);
                                }}
                                rows="2"
                            />
                        </div>
                    ))}
                </div>
                <button className="unite-button" onClick={handleUnite}>
                    Unite
                </button>
                <button
                    className="unite-button"
                    onClick={() => {
                        navigator.clipboard.writeText(outputText);
                    }}
                    style={{ backgroundColor: '#ffc107', width: '45%', marginRight: '10px' }}
                >
                    Copy
                </button>
                <textarea className="output-area" value={outputText} readOnly placeholder="United text will appear here" rows="5" />
            </div>
        );
    }


    function App() {
      const [scrollTop, setScrollTop] = React.useState(0);
      const [outputs, setOutputs] = React.useState(["", "", ""]); // Store united text from all parts

      return (
      <div>
        <div style={{ display: "flex", gap: "10px", marginBottom: "10px" }}>
          <button
            className="button"
            style={{ backgroundColor: "#28a745", color: "white", padding: "10px", fontSize: "16px" }}
            onClick={() => handleSave(outputs)}
          >
            Save
          </button>
          <button
            className="button"
            style={{ backgroundColor: "#ff5722", color: "white", padding: "10px", fontSize: "16px" }}
            onClick={() => handleLoad(setOutputs)}
          >
            Load
          </button>
        </div>

        <div className="app-container">
          <TextSplitterPart
            language="English"
            initialDelimiter=","
            scrollTop={scrollTop}
            setScrollTop={setScrollTop}
            setOutput={(text) => setOutputs((prev) => [text, prev[1], prev[2]])}
            outputText={outputs[0]}
          />
          <TextSplitterPart
            language="Arabic"
            lang="ar"
            initialDelimiter=","
            scrollTop={scrollTop}
            setScrollTop={setScrollTop}
            setOutput={(text) => setOutputs((prev) => [prev[0], text, prev[2]])}
            outputText={outputs[1]}
          />
          <TextSplitterPart
            language="Jp"
            initialDelimiter=","
            isJapanese={true}
            scrollTop={scrollTop}
            setScrollTop={setScrollTop}
            setOutput={(text) => setOutputs((prev) => [prev[0], prev[1], text])}
            outputText={outputs[2]}
          />
        </div>
      </div>
    );
  }


    function handleSave(outputs) {
      const textToSave = outputs.join("\n---\n"); // Separate different language parts with "---"
      const blob = new Blob([textToSave], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `text_split_${Date.now()}.txt`; // Random file name
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function handleLoad(setOutputs) {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "text/plain";
      input.onchange = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const content = e.target.result;
          const parts = content.split("\n---\n"); // Splitting based on our separator
          setOutputs(parts);
        };
        reader.readAsText(file);
      };
      input.click();
    }

    

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
