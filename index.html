<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ترجمة عبدالغني</title>
  <style>
    :root{
      --gap: clamp(16px, 4vw, 40px);
      --cover-min: 140px;   /* أصغر عرض للغلاف */
      --cover-ideal: 18vw;  /* عرض مفضل نسبي */
      --cover-max: 260px;   /* أكبر عرض للغلاف */
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --shadow-hover: 0 18px 50px rgba(0,0,0,0.5);
      --hover-scale: 1.06;
      --trans: 220ms ease;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #fff;
      background: #000;
    }

    /* قسم الخلفية */
    .hero {
      min-height: 100vh;
      position: relative;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 48px);
      /* استبدل الصورة التالية بخلفيتك 16:9 (مثلاً 1920x1080) */
      background-image: url("bg-1920x1080.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      isolation: isolate;
    }
    /* طبقة تعتيم خفيفة لتحسين التباين */
    .hero::before{
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
      z-index: -1;
    }

    /* عنوان اختياري */
    .title {
      text-align: center;
      margin-bottom: clamp(12px, 2vh, 24px);
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    /* حاوية الأغلفة */
    .covers {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: var(--gap);
    }

    /* عنصر الغلاف القابل للنقر */
    .cover {
      display: block;
      width: clamp(var(--cover-min), var(--cover-ideal), var(--cover-max));
      aspect-ratio: 135 / 190; /* نسبة واجهة غلاف PS2 (رأسي بشكل واضح) */
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transform: translateZ(0);
      transition: transform var(--trans), box-shadow var(--trans), filter var(--trans);
      will-change: transform, box-shadow, filter;
      position: relative;
      background: #111;
    }

    /* الصورة داخل الغلاف */
    .cover img{
      width: 100%;
      height: 100%;
      object-fit: cover; /* يحافظ على ملء الإطار بدون تشويه */
      display: block;
      transform: scale(1.001);
      transition: transform var(--trans), filter var(--trans);
    }

    /* تأثير تمرير: تكبير خفيف + ظل أعمق + تشبّع */
    .cover:hover,
    .cover:focus-visible{
      transform: scale(var(--hover-scale));
      box-shadow: var(--shadow-hover);
      outline: none;
    }
    .cover:hover img,
    .cover:focus-visible img{
      filter: saturate(1.08) contrast(1.03);
    }

    /* وميض رقيق من الأعلى لإحساس لامع */
    .cover::after{
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(200deg, rgba(255,255,255,0.08), rgba(0,0,0,0) 40%);
      pointer-events: none;
      mix-blend-mode: screen;
      transition: opacity var(--trans);
      opacity: 0.65;
    }
    .cover:hover::after { opacity: 0.85; }

    /* توافق أصغر الشاشات */
    @media (max-width: 520px){
      .covers { gap: 16px; }
      .title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <main class="hero" aria-label="صفحة التمهيد">
    <header class="title">
      <h1>ترجمة عبدالغني </h1>
      <p>اختر الغلاف للدخول لصفحة اللعبة</p>
    </header>

    <section class="covers" aria-label="أغلفة الألعاب">
      <!-- الغلاف الأول: استبدل الرابط والصورة والـalt -->
      <a class="cover" href="patch.html" aria-label="الدخول إلى لعبة 1">
        <img src="cover-game-1.jpg" alt="غلاف لعبة 1">
      </a>

      <!-- الغلاف الثاني: استبدل الرابط والصورة والـalt -->
      <a class="cover" href="patch2.html" aria-label="الدخول إلى لعبة 2">
        <img src="cover-game-22.jpg" alt="غلاف لعبة 2">
      </a>
    </section>
  </main>
</body>
</html>
