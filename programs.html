<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA2 translation + scroll support</title>
    <script src="https://unpkg.com/react@17.0.2/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
        }
        .app-container {
            display: flex;
            width: 100%;
            gap: 10px;
            overflow-x: auto;
        }
        .language-part {
            flex: 1;
            min-width: 300px;
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }
        .arabic-part {
            direction: rtl;
        }
        .arabic-part textarea, 
        .arabic-part input {
            text-align: right;
        }
        .arabic-part .small-input-wrapper {
            flex-direction: row-reverse;
        }
        .arabic-part .small-input-number {
            text-align: left;
        }
        .arabic-part .kakko-number {
            right: auto;
            left: -50px; 
        }
        .arabic-part .button-container {
            flex-direction: row-reverse;
        }
        .arabic-part .unite-button {
            margin-left: auto; 
            margin-right: 10px;
        }
        .arabic-part .play-button {
            margin-left: auto;  
            margin-right: 5px;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .main-input {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        .button {
            flex-grow: 1;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }
        .split-button {
            background-color: #007bff;
        }
        .count-button {
            background-color: #17a2b8;
        }
        .small-input-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .small-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        .small-input-number {
            width: 50px;
            text-align: right;
            color: #666;
            font-size: 14px;
            flex-shrink: 0;
        }
        .small-input {
            flex-grow: 1;
            height: 60px;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        .unite-button {
            width: 45%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
        }
        .output-area {
            width: 100%;
            height: 150px;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        .language-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .kakko-number {
            position: absolute; 
            right: -50px; 
            top: 50%; 
            transform: translateY(-50%);
            color: #666;
            font-size: 14px;
        }
        .play-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: center;">  
        <input class="folder-name" type="text" style="width: 100px;" placeholder="Folder Name">
        <input class="link-input" type="text" style="width: 100px;" placeholder="Server Link">
    </div>
    <div id="root"></div>
    <audio id="audioPlayer" style="display:none;"></audio>

    <script type="text/babel">
        function TextSplitterPart({ language, initialDelimiter, isJapanese, setOutput, outputText, mainText, setMainText, scrollTop, setScrollTop }) {
            const [smallTexts, setSmallTexts] = React.useState(new Array(1500).fill(''));
            const [delimiter, setDelimiter] = React.useState(initialDelimiter);
            const [kakkoNumbers, setKakkoNumbers] = React.useState(new Array(1500).fill(''));
            const isArabic = language === 'Arabic';
            const scrollRef = React.useRef(null);

            React.useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollTop;
                }
            }, [scrollTop]);

            const handleSplit = () => {
                const splitTexts = mainText.split(delimiter).map(text => text.trim());
                
                const newSmallTexts = new Array(1500).fill('');
                splitTexts.forEach((text, index) => {
                    if (index < 1500) {
                        newSmallTexts[index] = text;
                    }
                });

                setSmallTexts(newSmallTexts);
                setKakkoNumbers(new Array(1500).fill('')); // Reset when splitting
            };

            const handleUnite = () => {
                const unitedText = smallTexts.join(delimiter);
                setOutput(unitedText);
            };

            const handleCountKakkoWithNumbers = () => {
                const newKakkoNumbers = new Array(1500).fill('');
                let currentKakkoCount = 0;

                const newSmallTexts = smallTexts.map((text, index) => {
                    if (text.includes('「')) {
                        newKakkoNumbers[index] = currentKakkoCount.toString().padStart(4, '0');
                        currentKakkoCount++;
                    }
                    return text;
                });

                setKakkoNumbers(newKakkoNumbers);
                setSmallTexts(newSmallTexts);
            };

            const handlePlay = async (index) => {
                const folderName = document.querySelector('.folder-name').value;
                const serverLink = document.querySelector('.link-input').value || 'http://localhost:3000';
                const audioPlayer = document.getElementById('audioPlayer');
                const fourDigitNumber = kakkoNumbers[index];
                console.log(fourDigitNumber);
                if (fourDigitNumber) {
                    // Construct the filename based on the 4-digit number
                    const fileName = `${folderName}_${fourDigitNumber}.mp3`;
                    const fullPath = `${folderName}/${fileName}`; // Assuming server root as the base path
                    let audioURL = '';
                    
                    if (!folderName) {
                        alert('No folder selected!');
                        return;
                    }

                    await fetch(serverLink, {
                        method: 'POST',
                        body: JSON.stringify({ fullPath })
                    }).then((response) => {
                        return response.blob();
                    }).then((blob) => {
                        audioURL = URL.createObjectURL(blob);
                    }).catch((error) => {
                        console.error('Error fetching audio:', error);
                        alert('Failed to fetch audio file.');
                    });
                    
                    audioPlayer.src = audioURL;
                    audioPlayer.play().catch(e => {
                        alert('Audio file not found or could not be played.');
                    });
                } else {
                    alert('No corresponding audio file for this text segment.');
                }
            };

            const handleScroll = (e) => {
                setScrollTop(e.target.scrollTop);
            };

            return (
                <div className={`language-part ${isArabic ? 'arabic-part' : ''}`}>
                    <div className="language-title">{language} Part</div>
                    <input 
                        type="text" 
                        value={delimiter} 
                        onChange={(e) => setDelimiter(e.target.value)}
                        placeholder={`Delimiter for ${language}`}
                        style={{width: '100%', marginBottom: '10px'}}
                    />
                    <textarea 
                        className="main-input" 
                        value={mainText}
                        onChange={(e) => setMainText(e.target.value)}
                        placeholder={`Enter ${language} text to split`}
                        rows="5"
                    />
                    <div className="button-container">
                        <button 
                            className="button split-button" 
                            onClick={handleSplit}
                        >
                            Split
                        </button>
                        {isJapanese && (
                            <button 
                                className="button count-button" 
                                onClick={handleCountKakkoWithNumbers}
                            >
                                Count 「
                            </button>
                        )}
                    </div>
                    <div 
                        className="small-input-container"
                        ref={scrollRef}
                        onScroll={handleScroll}
                    >
                        {smallTexts.map((text, index) => (
                            <div key={index} className="small-input-wrapper">
                                <div className={`small-input-number ${isArabic ? 'arabic-part' : ''}`}>{index + 1}.</div>
                                <textarea 
                                    className="small-input"
                                    value={text}
                                    onChange={(e) => {
                                        const newTexts = [...smallTexts];
                                        newTexts[index] = e.target.value;
                                        setSmallTexts(newTexts);
                                    }}
                                    rows="2"
                                />
                                {isJapanese && kakkoNumbers[index] && (
                                    <div className={`kakko-number ${isArabic ? 'arabic-part' : ''}`}>
                                        {kakkoNumbers[index]}
                                    </div>
                                )}
                                {isJapanese && (
                                    <button 
                                        className="button play-button" 
                                        onClick={() => handlePlay(index)}
                                    >
                                        ▶
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                    <button 
                        className="unite-button" 
                        onClick={handleUnite}
                    >
                        Unite
                    </button>
                    <button
                        className="unite-button"
                        onClick={() => {
                            navigator.clipboard.writeText(outputText);
                        }}
                        style={{ backgroundColor: '#ffc107', width: '45%', marginRight: '10px', marginLeft: '10px'}}
                    >
                        Copy
                    </button>
                    <textarea 
                        className="output-area"
                        value={outputText}
                        readOnly
                        placeholder="United text will appear here"
                        rows="5"
                    />
                </div>
            );
        }

        function App() {
            const [outputs, setOutputs] = React.useState(["", "", ""]);
            const [mainTexts, setMainTexts] = React.useState(["", "", ""]);
            const [scrollTop, setScrollTop] = React.useState(0);

            const handleSave = () => {
                const textToSave = outputs.join("\n---\n"); // Separate different language parts with "---"
                const blob = new Blob([textToSave], { type: "text/plain" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `text_split_${Date.now()}.txt`; // Random file name
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const handleLoad = () => {
                const input = document.createElement("input");
                input.type = "file";
                input.accept = "text/plain";
                input.onchange = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const content = e.target.result;
                        const parts = content.split("\n---\n"); // Splitting based on our separator
                        setMainTexts(parts.slice(0, 3)); // Load into main text inputs
                        setOutputs(parts.slice(0, 3)); // Also update outputs for consistency
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            return (
                <div>
                    <div style={{ display: "flex", gap: "10px", marginBottom: "10px" }}>
                        <button className="button" style={{ backgroundColor: '#28a745', color: 'white', padding: '10px', fontSize: '16px' }} onClick={handleSave}>Save</button>
                        <button className="button" style={{ backgroundColor: '#ff5722', color: 'white', padding: '10px', fontSize: '16px' }} onClick={handleLoad}>Load</button>
                    </div>
                    <div className="app-container">
                        <TextSplitterPart 
                            language="English" 
                            initialDelimiter="," 
                            setOutput={(text) => setOutputs(prev => [text, prev[1], prev[2]])}
                            outputText={outputs[0]}
                            mainText={mainTexts[0]}
                            setMainText={(text) => setMainTexts(prev => [text, prev[1], prev[2]])}
                            scrollTop={scrollTop}
                            setScrollTop={setScrollTop}
                        />
                        <TextSplitterPart 
                            language="Arabic" 
                            initialDelimiter="," 
                            setOutput={(text) => setOutputs(prev => [prev[0], text, prev[2]])}
                            outputText={outputs[1]}
                            mainText={mainTexts[1]}
                            setMainText={(text) => setMainTexts(prev => [prev[0], text, prev[2]])}
                            scrollTop={scrollTop}
                            setScrollTop={setScrollTop}
                        />
                        <TextSplitterPart 
                            language="Jp" 
                            initialDelimiter="," 
                            isJapanese={true} 
                            setOutput={(text) => setOutputs(prev => [prev[0], prev[1], text])}
                            outputText={outputs[2]}
                            mainText={mainTexts[2]}
                            setMainText={(text) => setMainTexts(prev => [prev[0], prev[1], text])}
                            scrollTop={scrollTop}
                            setScrollTop={setScrollTop}
                        />
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
