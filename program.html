<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multilingual Text Splitter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/17.0.2/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
        }
        .app-container {
            display: flex;
            width: 100%;
            gap: 10px;
            overflow-x: auto;
        }
        .language-part {
            flex: 1;
            min-width: 300px;
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }
        .main-input {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        .split-button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .small-input-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .small-input {
            width: 100%;
            height: 60px;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        .unite-button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .output-area {
            width: 100%;
            height: 150px;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        .language-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function TextSplitterPart({ language, initialDelimiter }) {
            const [mainText, setMainText] = React.useState('');
            const [smallTexts, setSmallTexts] = React.useState(new Array(1000).fill(''));
            const [outputText, setOutputText] = React.useState('');
            const [delimiter, setDelimiter] = React.useState(initialDelimiter);

            const handleSplit = () => {
                const splitTexts = mainText.split(delimiter).map(text => text.trim());
                
                const newSmallTexts = new Array(1000).fill('');
                splitTexts.forEach((text, index) => {
                    if (index < 1000) {
                        newSmallTexts[index] = text;
                    }
                });

                setSmallTexts(newSmallTexts);
            };

            const handleUnite = () => {
                const filteredTexts = smallTexts.filter(text => text.trim() !== '');
                const unitedText = filteredTexts.join(delimiter);
                setOutputText(unitedText);
            };

            return (
                <div className="language-part">
                    <div className="language-title">{language} Part</div>
                    <input 
                        type="text" 
                        value={delimiter} 
                        onChange={(e) => setDelimiter(e.target.value)}
                        placeholder="Delimiter"
                        style={{width: '100%', marginBottom: '10px'}}
                    />
                    <textarea 
                        className="main-input" 
                        value={mainText}
                        onChange={(e) => setMainText(e.target.value)}
                        placeholder={`Enter ${language} text to split`}
                        rows="5"
                    />
                    <button 
                        className="split-button" 
                        onClick={handleSplit}
                    >
                        Split
                    </button>
                    <div className="small-input-container">
                        {smallTexts.map((text, index) => (
                            <textarea 
                                key={index} 
                                className="small-input"
                                value={text}
                                onChange={(e) => {
                                    const newTexts = [...smallTexts];
                                    newTexts[index] = e.target.value;
                                    setSmallTexts(newTexts);
                                }}
                                rows="2"
                            />
                        ))}
                    </div>
                    <button 
                        className="unite-button" 
                        onClick={handleUnite}
                    >
                        Unite
                    </button>
                    <textarea 
                        className="output-area"
                        value={outputText}
                        readOnly
                        placeholder="United text will appear here"
                        rows="5"
                    />
                </div>
            );
        }

        function App() {
            return (
                <div className="app-container">
                    <TextSplitterPart language="Arabic" initialDelimiter="،" />
                    <TextSplitterPart language="English" initialDelimiter="," />
                    <TextSplitterPart language="Japanese" initialDelimiter="、" />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
