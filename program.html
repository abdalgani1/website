<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Text Splitter</title>
    <script src="https://unpkg.com/react@17.0.2/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
        }
        .app-container {
            display: flex;
            width: 100%;
            gap: 10px;
            overflow-x: auto;
        }
        .language-part {
            flex: 1;
            min-width: 300px;
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .main-input {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        .button {
            flex-grow: 1;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }
        .split-button {
            background-color: #007bff;
        }
        .count-button {
            background-color: #17a2b8;
        }
        .small-input-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .small-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        .small-input-number {
            width: 50px;
            text-align: right;
            color: #666;
            font-size: 14px;
            flex-shrink: 0;
        }
        .small-input {
            flex-grow: 1;
            height: 60px;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        .unite-button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .output-area {
            width: 100%;
            height: 150px;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        .language-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .kakko-number {
            position: absolute; 
            right: -50px; 
            top: 50%; 
            transform: translateY(-50%);
            color: #666;
            font-size: 14px;
        }
        .play-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <audio id="audioPlayer" style="display:none;"></audio>

    <script type="text/babel">
        function TextSplitterPart({ language, initialDelimiter, isJapanese }) {
            const [mainText, setMainText] = React.useState('');
            const [smallTexts, setSmallTexts] = React.useState(new Array(1000).fill(''));
            const [outputText, setOutputText] = React.useState('');
            const [delimiter, setDelimiter] = React.useState(initialDelimiter);
            const [kakkoNumbers, setKakkoNumbers] = React.useState(new Array(1000).fill(''));

            const handleSplit = () => {
                const splitTexts = mainText.split(delimiter).map(text => text.trim());
                
                const newSmallTexts = new Array(1000).fill('');
                splitTexts.forEach((text, index) => {
                    if (index < 1000) {
                        newSmallTexts[index] = text;
                    }
                });

                setSmallTexts(newSmallTexts);
                setKakkoNumbers(new Array(1000).fill('')); // Reset when splitting
            };

            const handleUnite = () => {
                const filteredTexts = smallTexts.filter(text => text.trim() !== '');
                const unitedText = filteredTexts.join(delimiter);
                setOutputText(unitedText);
            };

            const handleCountKakkoWithNumbers = () => {
                const newKakkoNumbers = new Array(1000).fill('');
                let currentKakkoCount = 0;

                const newSmallTexts = smallTexts.map((text, index) => {
                    if (text.includes('「')) {
                        newKakkoNumbers[index] = currentKakkoCount.toString().padStart(4, '0');
                        currentKakkoCount++;
                    }
                    return text;
                });

                setKakkoNumbers(newKakkoNumbers);
                setSmallTexts(newSmallTexts);
            };

            const handlePlay = (index) => {
                const audioPlayer = document.getElementById('audioPlayer');
                const fourDigitNumber = kakkoNumbers[index];
                console.log(fourDigitNumber)
                if (fourDigitNumber) {
                    // Construct the filename based on the 4-digit number
                    const fileName = `2003_${fourDigitNumber}.mp3`;
                    const fullPath = `2003/${fileName}`; // Assuming server root as the base path
                    
                    // Update the source of the audio element
                    audioPlayer.src = fullPath;
                    audioPlayer.play().catch(e => {
                        console.error('Error playing audio:', e);
                    });
                } else {
                    console.log('No corresponding audio file for this text segment.');
                }
            };

            return (
                <div className="language-part">
                    <div className="language-title">{language} Part</div>
                    <input 
                        type="text" 
                        value={delimiter} 
                        onChange={(e) => setDelimiter(e.target.value)}
                        placeholder="Delimiter"
                        style={{width: '100%', marginBottom: '10px'}}
                    />
                    <textarea 
                        className="main-input" 
                        value={mainText}
                        onChange={(e) => setMainText(e.target.value)}
                        placeholder={`Enter ${language} text to split`}
                        rows="5"
                    />
                    <div className="button-container">
                        <button 
                            className="button split-button" 
                            onClick={handleSplit}
                        >
                            Split
                        </button>
                        {isJapanese && (
                            <button 
                                className="button count-button" 
                                onClick={handleCountKakkoWithNumbers}
                            >
                                Count 「
                            </button>
                        )}
                    </div>
                    <div className="small-input-container">
                        {smallTexts.map((text, index) => (
                            <div key={index} className="small-input-wrapper">
                                <div className="small-input-number">{index + 1}.</div>
                                <textarea 
                                    className="small-input"
                                    value={text}
                                    onChange={(e) => {
                                        const newTexts = [...smallTexts];
                                        newTexts[index] = e.target.value;
                                        setSmallTexts(newTexts);
                                    }}
                                    rows="2"
                                />
                                {isJapanese && kakkoNumbers[index] && (
                                    <div className="kakko-number">
                                        {kakkoNumbers[index]}
                                    </div>
                                )}
                                {isJapanese && (
                                    <button 
                                        className="button play-button" 
                                        onClick={() => handlePlay(index)}
                                    >
                                        ▶
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                    <button 
                        className="unite-button" 
                        onClick={handleUnite}
                    >
                        Unite
                    </button>
                    <textarea 
                        className="output-area"
                        value={outputText}
                        readOnly
                        placeholder="United text will appear here"
                        rows="5"
                    />
                </div>
            );
        }

        function App() {
            return (
                <div className="app-container">
                    <TextSplitterPart language="Arabic" initialDelimiter="،" />
                    <TextSplitterPart language="English" initialDelimiter="," />
                    <TextSplitterPart language="Japanese" initialDelimiter="、" isJapanese={true} />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
